# Карточка дома — единственное место, где хранятся данные.
# Поменяли что-то здесь (например, цену) — все тексты, сайт и посты
# пересоберутся сами при следующем запуске.

title: Дом на Капустина, Шахтёрск
city: Шахтёрск
region: ДНР
street: улица Капустина

# Цена в рублях. Если оставить null — в текстах будет «цена — в личных сообщениях».
# Совет: с ценой откликов заметно больше, а многие чаты без цены объявление удаляют.
price: null

area_house: 86.5        # м²
area_land: 9.1          # соток
year_built: 1978
walls: дерево + глина
layout: 4 жилых комнаты + 5 общих
extra_rooms: [веранда, кладовая]
land_category: ИЖС
egrn: true              # дом внесён в российский реестр (ЕГРН)

condition: >-
  Дом требует ремонта — говорим сразу и честно. Но за этим стоит нормальная
  цена и возможность сделать всё под себя, а не переплачивать за чужой вкус.

utilities:
  - icon: "💧"
    name: Вода
    short: жила под скважину + бак на 3 т
    text: >-
      водопровода нет — как и по всему городу, увы. Но на участке есть
      разведанная жила под скважину, плюс накопительный бак на 3 тонны уже
      стоит и готов к работе.
  - icon: "🔥"
    name: Отопление
    short: водяное от печки на весь дом
    text: >-
      водяное от печки, обогревает весь дом, а не одну комнату. Сделано
      качественно и по совести.
  - icon: "🟦"
    name: Газ
    short: по улице, подключение несложное
    text: проходит прямо по улице, подключение реальное и несложное.
  - icon: "🚽"
    name: Септик
    short: есть
    text: уже есть, хороший.

location: >-
  Тихий район, асфальтированная дорога, рядом школа и магазины — с логистикой
  всё в порядке.

outbuildings:
  - времянка
  - пристроенный сарай
  - гараж под мотоцикл
  - угольник
  - сарай для дров
  - новый туалет
  - летний душ

garden: [два ореха, черешня, вишни, айва, малина, смородина, яблони, сливы]

neighbors: Соседи спокойные и доброжелательные.

contact:
  phone: "+7 999 585 79 40"
  telegram: null        # например "@my_username" — добавит кнопку «Написать в Telegram»
  name: null            # например "Анна" — «Звоните, Анна»

# Адрес сайта-визитки дома. После первой публикации на GitHub Pages
# впишите сюда ссылку — она появится во всех объявлениях.
site_url: null

# Публикуем только фото с улицы; остальное — по запросу в личке.
