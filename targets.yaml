# Куда публикуем. Каждая запись — одна площадка.
#
# platform:
#   telegram      — чат/группа или бот-«предложка» канала, пишем от вашего аккаунта
#   telegram_bot  — ВАШ канал, пост от вашего бота (бот — админ канала)
#   vk            — стена сообщества ВК (или ваша стена), пост от вашего аккаунта
#   manual        — сайт без API: текст готов в out/kit.html, разместить вручную
#
# variant: full | medium | short | plain  — какой текст (см. `python -m house_auto texts`)
# min_interval_days — не чаще, чем раз в N дней
# days — в какие дни недели можно (mon tue wed thu fri sat sun); пусто — в любой
# topic_id — номер темы, если чат разбит на темы
# delete_previous — перед новым постом удалить прошлый (чат не засоряется)
# enabled — false — площадка выключена
#
# Все адреса ниже проверены 28.10.2026 (существуют, тип и число участников — на t.me / ok.ru).
# Новые площадки ищет `python -m house_auto discover` → candidates/

settings:
  max_posts_per_run: 20
  delay_seconds: [45, 120]
  discover_keywords:
    - Шахтёрск
    - Шахтерск
    - Шахтёрск объявления
    - Шахтерск барахолка
    - Торез объявления
    - Енакиево объявления
    - Харцызск объявления
    - Снежное ДНР
    - Донецк недвижимость
    - ДНР недвижимость
    - недвижимость ДНР продажа
    - продажа домов Донецк
    - дома ДНР
    - Донецк объявления
    - ДНР барахолка
    - Макеевка недвижимость

defaults:
  variant: medium
  photos: 2
  min_interval_days: 7
  delete_previous: true
  enabled: true

targets:
