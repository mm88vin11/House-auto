name: "🌐 Сайт дома"

# Сайт и пульт собираются в ветку `site` и открываются без входа:
#   объявление — https://raw.githack.com/mm88vin11/House-auto/site/index.html
#   пульт      — https://raw.githack.com/mm88vin11/House-auto/site/pult/index.html
on:
  push:
    branches: [main]
    paths: ["house.yaml", "targets.yaml", "photos/**", "house_auto/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m house_auto site
      - name: Выложить в ветку site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -q -b site
          git config user.name "house-auto"
          git config user.email "house-auto@users.noreply.github.com"
          git add -A && git commit -q -m "Сайт из ${{ github.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" site
