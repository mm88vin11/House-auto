name: "📦 Собрать приложение"

on:
  push:
    branches: [main]
    paths: ["house_auto/**", "run_app.py", "house.yaml", "targets.yaml", "photos/**", "app/**",
            "requirements.txt", ".github/workflows/build-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: HouseAuto-Windows
          - os: macos-latest
            name: HouseAuto-Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller==6.22.3
      - name: Сборка
        shell: bash
        run: |
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          pyinstaller --onefile --name HouseAuto \
            --add-data "house.yaml${SEP}defaults" \
            --add-data "targets.yaml${SEP}defaults" \
            --add-data "photos${SEP}defaults/photos" \
            --hidden-import house_auto.posters.telegram_user \
            --hidden-import house_auto.posters.telegram_bot \
            --hidden-import house_auto.posters.vk \
            run_app.py
      - name: Архив
        shell: bash
        run: |
          mkdir pkg && cp dist/HouseAuto* pkg/ && cp app/КАК_ЗАПУСТИТЬ.txt pkg/
          python -c "import shutil; shutil.make_archive('${{ matrix.name }}', 'zip', 'pkg')"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Выпуск «Скачать приложение»
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest dist/*/*.zip --target "${{ github.sha }}" \
            --title "Приложение «Продажа дома»" \
            --notes "Скачайте архив для своей системы, распакуйте и запустите HouseAuto. Инструкция — в файле КАК_ЗАПУСТИТЬ.txt внутри архива."
